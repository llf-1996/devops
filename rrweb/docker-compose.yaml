version: '3.8'

services:
  rrweb-api:
    build: .
    restart: unless-stopped
    ports:
      - "11070:8000"
    volumes:
      - ./:/data/rrweb
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://127.0.0.1:8000/ping', timeout=5); r.raise_for_status()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "10"
